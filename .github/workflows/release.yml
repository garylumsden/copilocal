name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/Copilocal.Tests/Copilocal.Tests.csproj -c Release --nologo

  build:
    needs: test
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: ".exe"
          - rid: win-arm64
            os: windows-11-arm
            ext: ".exe"
          - rid: osx-arm64
            os: macos-15
            ext: ""
          - rid: osx-x64
            os: macos-15-intel
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: dotnet publish copilocal.csproj -c Release -r ${{ matrix.rid }} -o out

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "out/copilocal${{ matrix.ext }}" "dist/copilocal-${{ matrix.rid }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7
        with:
          name: copilocal-${{ matrix.rid }}
          path: dist/copilocal-${{ matrix.rid }}${{ matrix.ext }}

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256
        run: |
          cd dist
          sha256sum copilocal-* | tee SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/copilocal-*
            dist/SHA256SUMS.txt
          generate_release_notes: true

  # Submit the new version's Windows installers to winget (microsoft/winget-pkgs).
  # Opt-in: set repo variable PUBLISH_WINGET=true and secret WINGET_TOKEN to a classic
  # GitHub PAT with public_repo scope.
  winget:
    needs: release
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_WINGET == 'true' }}
    steps:
      - name: Download WingetCreate
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe `
            -OutFile wingetcreate.exe

      - name: Submit winget update
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $release = 'https://github.com/garylumsden/copilocal/releases'
          .\wingetcreate.exe update Gjlumsden.Copilocal `
            --version $version `
            --urls `
              "$release/download/${{ github.ref_name }}/copilocal-win-x64.exe|x64" `
              "$release/download/${{ github.ref_name }}/copilocal-win-arm64.exe|arm64" `
            --release-notes-url "$release/tag/${{ github.ref_name }}" `
            --submit `
            --no-open
